<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3A0F1C">
<title>Menu</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
:root{--navy:#3A0F1C;--navy2:#4E1828;--ind:#C2681E;--ind-l:#F8EDE3;--gold:#D4A537;--bg:#F6F5F2;--ink:#22161A;--muted:#6E6266;--line:#EDE6E3;--ok:#14915F;--ok-bg:#E8F6EF;--bad:#C93636;--warn:#B7791F;--r:18px}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.5 "Hanken Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ind)}
.hero{background:radial-gradient(120% 160% at 100% 0,#7A2A3A 0,var(--navy) 58%);color:#fff;padding:20px 20px 62px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.09);box-shadow:0 0 0 30px rgba(255,255,255,.03),0 0 0 60px rgba(255,255,255,.02)}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ind),#E9A25F);display:grid;place-items:center;font-style:normal}
.hero h1{font:600 32px/1.08 Fraunces,serif;margin:16px 0 6px;position:relative;z-index:1}
.hero .sub{color:#E8C9CF;font-size:14px;position:relative;z-index:1}
.chip-t{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px;margin-top:10px}
.lang{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;padding:6px 12px;font-weight:700;cursor:pointer}
.wrap{max-width:680px;margin:-42px auto 0;padding:0 14px;position:relative}
.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:0 8px 28px rgba(58,15,28,.08);margin-bottom:14px}
.card h2{font:600 22px/1.2 Fraunces,serif;margin:0 0 10px;color:var(--navy)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.muted{color:var(--muted)}.sm{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ind);border-color:var(--ind);color:#fff}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.block{width:100%}.btn:disabled{opacity:.5}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:12.5px;cursor:pointer;text-align:center}
.act span{font-size:22px}.act:active{transform:scale(.97)}
.cats{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.cats button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.search{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;margin:4px 0 6px}
.sec h3{font:600 20px Fraunces,serif;margin:18px 2px 10px;color:var(--navy)}
.dish{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(58,15,28,.05);cursor:pointer;border:1.5px solid transparent;position:relative}
.dish:active{border-color:var(--ind)}
.dish b{font-size:16px}.dish p{margin:4px 0 6px;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish .pr{font-weight:800;color:var(--navy)}.dish .pr s{color:var(--muted);font-weight:500;margin-right:6px}
.dish .ph{width:96px;height:96px;border-radius:14px;background:linear-gradient(135deg,var(--ind-l),#F7EFDF) center/cover;display:grid;place-items:center;font-size:40px}
.dish.out{opacity:.5;cursor:default}.dish .q{position:absolute;top:-6px;left:-6px;background:var(--ind);color:#fff;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-weight:800;font-size:12px}
.tags{display:flex;gap:4px;flex-wrap:wrap}.tags i{font-style:normal;font-size:11px;font-weight:700;background:var(--ind-l);color:var(--ind);border-radius:99px;padding:2px 8px}
.tags i.al{background:#FFF4E5;color:var(--warn)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(246,245,242,0),var(--bg) 30%);z-index:20}
.bar .btn{max-width:652px;margin:0 auto;display:flex;width:100%;justify-content:space-between;box-shadow:0 10px 30px rgba(194,104,30,.35);padding:15px 18px;font-size:16px}
.sheet-bg{position:fixed;inset:0;background:rgba(30,8,14,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet h2{font:600 24px/1.15 Fraunces,serif;margin:0 0 6px;color:var(--navy)}
.sheet .x{float:right;border:0;background:var(--bg);border-radius:99px;width:34px;height:34px;font-size:18px;cursor:pointer}
@keyframes up{from{transform:translateY(40px);opacity:.3}}@keyframes fade{from{opacity:0}}
.opt{margin:14px 0}.opt h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.opt h4 em{font-style:normal;font-size:11px;background:#FDEDED;color:var(--bad);border-radius:99px;padding:1px 8px}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.ch label{position:relative}.ch input{position:absolute;opacity:0}
.ch span{display:inline-block;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:600;cursor:pointer}
.ch input:checked+span{border-color:var(--ind);background:var(--ind-l);color:var(--ind)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:14px}
.qty button{border:0;background:none;width:42px;height:42px;font-size:20px;cursor:pointer}.qty b{min-width:28px;text-align:center}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
label.f{display:block;font-weight:600;font-size:13px;margin:10px 0 0}label.f .in{margin-top:5px}
.lines .l{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lines .l:last-child{border-bottom:0}.lines small{display:block;color:var(--muted)}
.st{font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap}
.st.received{background:#F4EFEC;color:var(--muted)}.st.kitchen,.st.cooking{background:#FFF4E5;color:var(--warn)}.st.ready{background:var(--ok-bg);color:var(--ok)}.st.served{background:var(--ind-l);color:var(--ind)}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.big{font-size:20px;font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.steps{display:flex;justify-content:space-between;position:relative;margin:10px 0 4px}
.steps:before{content:"";position:absolute;left:8%;right:8%;top:15px;height:3px;background:var(--line)}
.steps div{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);flex:1;text-align:center}
.steps i{width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px}
.steps .on{color:var(--ink)}.steps .on i{border-color:var(--ind);background:var(--ind);color:#fff}
.steps .cur i{box-shadow:0 0 0 6px rgba(194,104,30,.2);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(194,104,30,.06)}}
.tips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;font-weight:700;cursor:pointer}
.slots button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.slots button:disabled{opacity:.35;text-decoration:line-through}
.stars{display:flex;gap:6px;font-size:34px;justify-content:center}.stars button{border:0;background:none;cursor:pointer;color:#E2D9D6;padding:0}.stars button.on{color:var(--gold)}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:14px;font-weight:700;text-align:center}
.err{background:#FDEDED;color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:600;margin-top:10px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#F1EAE6;border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;border-radius:11px;padding:10px;font-weight:800;background:none;cursor:pointer}.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--navy)}
.wifi{display:flex;gap:10px;align-items:center;font-size:13px;background:var(--ind-l);border-radius:12px;padding:10px 12px;margin-top:12px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 10px}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:420px){.acts{grid-template-columns:repeat(2,1fr)}.slots{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="hero"><div class="top"><div class="brand"><i>✦</i><span>…</span></div></div><h1>&nbsp;</h1></div><div class="wrap"><div class="card"><div class="skel"></div></div></div></div>
<script>
'use strict';
let lang = (localStorage.getItem('tk:lang') || navigator.language || 'fr').slice(0, 2) === 'en' ? 'en' : 'fr';
const L = (fr, en) => (lang === 'en' ? en : fr);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => `${Math.round(Number(n) || 0).toLocaleString('fr-FR').replace(/ | /g, ' ')} F`;
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const parts = location.pathname.split('/').filter(Boolean);
const mode = parts[0] === 'm' ? 'table' : parts[0] === 'o' ? 'track' : parts[0] === 'reserve' ? 'reserve' : 'order';
const token = parts[1] || '';
const cParam = new URLSearchParams(location.search).get('c') || '';
let info = null, check = null, cart = [], cat = 'all', q = '', kind = 'takeaway', pollT = null;

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error?.message || j.message || L('Une erreur est survenue', 'Something went wrong'));
  return j;
}
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 3200); }
const emoji = (n = '') => { const s = n.toLowerCase(); return /bi[eè]re|beer|castel|33|guinness/.test(s) ? '🍺' : /vin|wine|champagne/.test(s) ? '🍷' : /cocktail|mojito|spritz|gin|whisky|rhum/.test(s) ? '🍸' : /jus|juice|soda|eau|water|coca|café|coffee|thé|tea|bissap|gingembre/.test(s) ? '🥤' : /dessert|g[aâ]teau|tarte|glace|cake|fondant|crème/.test(s) ? '🍰' : /poisson|fish|bar|capitaine|crevette|gambas|sole|bar braisé/.test(s) ? '🐟' : /poulet|chicken|dg/.test(s) ? '🍗' : /b[oœ]uf|steak|entrec[oô]te|filet|brochette|soya|viande|côte/.test(s) ? '🥩' : /salade|avocat/.test(s) ? '🥗' : /ndol[eé]|eru|okok|kondr[eé]|sauce|mbongo|koki/.test(s) ? '🍲' : /frite|plantain|miondo|b[aâ]ton|riz/.test(s) ? '🍟' : '🍽️'; };
const nm = (x) => (lang === 'en' && x.name_en ? x.name_en : x.name);
const priceOf = (it) => it.happy ?? it.price;

function hero(title, sub, extra = '') {
  return `<div class="hero"><div class="top"><div class="brand"><i>✦</i><span>${esc(info?.name || 'Teknons Resto')}</span></div><button class="lang" id="lang">${lang === 'fr' ? 'EN' : 'FR'}</button></div>
    <h1>${title}</h1><div class="sub">${sub}</div>${extra}</div>`;
}
function bindLang() { const b = $('#lang'); if (b) b.onclick = () => { lang = lang === 'fr' ? 'en' : 'fr'; try { localStorage.setItem('tk:lang', lang); } catch {} render(); }; }
function sheet(html, onOpen) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><button class="x" aria-label="close">×</button>${html}</div>`;
  document.body.append(bg); document.body.style.overflow = 'hidden';
  const close = () => { bg.remove(); document.body.style.overflow = ''; };
  bg.onclick = (e) => { if (e.target === bg) close(); }; $('.x', bg).onclick = close;
  onOpen?.($('.sheet', bg), close);
  return close;
}

// ---------------- Menu ----------------
function menuHtml() {
  const m = info.menu; const ql = q.toLowerCase();
  const items = m.items.filter((x) => (!ql || nm(x).toLowerCase().includes(ql) || (x.description || '').toLowerCase().includes(ql)));
  const cats = m.categories.filter((c) => items.some((x) => x.category_id === c.id));
  return `${m.happy_hour ? `<div class="card" style="background:linear-gradient(135deg,#FFF6DE,#FFFDF6);margin-bottom:10px"><b>🍹 Happy hour</b> · −${m.happy_hour} % ${L('sur les boissons, maintenant', 'on drinks, right now')}</div>` : ''}
  <input class="search" id="q" type="search" placeholder="${L('Rechercher un plat, une boisson…', 'Search a dish, a drink…')}" value="${esc(q)}">
  <div class="cats" id="cats"><button data-c="all" class="${cat === 'all' ? 'on' : ''}">${L('Tout', 'All')}</button>${cats.map((c) => `<button data-c="${c.id}" class="${String(c.id) === cat ? 'on' : ''}">${esc(lang === 'en' && c.name_en ? c.name_en : c.name)}</button>`).join('')}</div>
  ${cats.map((c) => `<div class="sec" id="c${c.id}"><h3>${esc(lang === 'en' && c.name_en ? c.name_en : c.name)}</h3>${items.filter((x) => x.category_id === c.id).map(dishHtml).join('')}</div>`).join('') || `<p class="muted" style="text-align:center">${L('Aucun résultat.', 'No result.')}</p>`}`;
}
function dishHtml(x) {
  const inCart = cart.filter((c) => c.product_id === x.id).reduce((t, c) => t + c.qty, 0);
  const tags = String(x.tags || '').split(',').map((s) => s.trim()).filter(Boolean).slice(0, 3);
  const desc = lang === 'en' && x.description_en ? x.description_en : x.description;
  return `<div class="dish ${x.sold_out ? 'out' : ''}" data-i="${x.id}">${inCart ? `<span class="q">${inCart}</span>` : ''}<div><b>${esc(nm(x))}</b>${desc ? `<p>${esc(desc)}</p>` : ''}
    <div class="tags" style="margin-bottom:6px">${tags.map((t) => `<i>${esc(t)}</i>`).join('')}${x.allergens ? `<i class="al">⚠ ${esc(x.allergens)}</i>` : ''}${x.sold_out ? `<i class="al">${L('Épuisé', 'Sold out')}</i>` : x.left != null && x.left <= 5 ? `<i class="al">${L('Plus que', 'Only')} ${x.left}</i>` : ''}</div>
    <span class="pr">${x.happy ? `<s>${money(x.price)}</s>${money(x.happy)}` : money(x.price)}</span></div>
    <div class="ph" ${x.image ? `style="background-image:url('${esc(x.image)}')"` : ''}>${x.image ? '' : emoji(x.name)}</div></div>`;
}
function wireMenu() {
  const qi = $('#q'); if (qi) qi.oninput = (e) => { q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll('#cats [data-c]').forEach((b) => b.onclick = () => { cat = b.dataset.c; document.querySelectorAll('#cats button').forEach((x) => x.classList.toggle('on', x === b)); if (cat === 'all') window.scrollTo({ top: 0, behavior: 'smooth' }); else $('#c' + cat)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  document.querySelectorAll('[data-i]').forEach((d) => d.onclick = () => { const it = info.menu.items.find((x) => x.id === Number(d.dataset.i)); if (it && !it.sold_out) dishSheet(it); });
}
function dishSheet(it) {
  let qty = 1;
  const groups = it.options || [];
  const desc = lang === 'en' && it.description_en ? it.description_en : it.description;
  sheet(`${it.image ? `<div style="height:200px;border-radius:18px;background:url('${esc(it.image)}') center/cover;margin:30px 0 12px"></div>` : `<div style="font-size:64px;text-align:center;margin:20px 0 6px">${emoji(it.name)}</div>`}
    <h2>${esc(nm(it))}</h2>${desc ? `<p class="muted" style="margin:0 0 8px">${esc(desc)}</p>` : ''}${it.allergens ? `<div class="tags"><i class="al">⚠ ${L('Allergènes', 'Allergens')} : ${esc(it.allergens)}</i></div>` : ''}
    ${groups.map((g, gi) => `<div class="opt"><h4>${esc(g.group)} ${g.required ? `<em>${L('obligatoire', 'required')}</em>` : ''}</h4><div class="ch">${g.choices.map((c, ci) => `<label><input type="${g.multi ? 'checkbox' : 'radio'}" name="g${gi}" value="${esc(c.name)}" ${g.required && !g.multi && ci === 0 ? 'checked' : ''}><span>${esc(c.name)}${c.price ? ` +${money(c.price)}` : ''}</span></label>`).join('')}</div></div>`).join('')}
    <label class="f">${L('Une précision pour la cuisine ?', 'A note for the kitchen?')}<input class="in" id="note" placeholder="${L('Sans piment, bien cuit…', 'No chili, well done…')}"></label>
    <div class="row between" style="margin-top:16px"><div class="qty"><button id="m">−</button><b id="qv">1</b><button id="p">+</button></div><button class="btn primary" id="add" style="flex:1">${L('Ajouter', 'Add')} · <span id="pt"></span></button></div>`, (s, close) => {
    const opts = () => { const o = []; groups.forEach((g, gi) => s.querySelectorAll(`[name=g${gi}]:checked`).forEach((i) => o.push(i.value))); return o; };
    const unit = () => priceOf(it) + groups.flatMap((g) => g.choices).filter((c) => opts().includes(c.name)).reduce((t, c) => t + c.price, 0);
    const upd = () => { $('#qv', s).textContent = qty; $('#pt', s).textContent = money(unit() * qty); };
    s.addEventListener('change', upd); $('#m', s).onclick = () => { qty = Math.max(1, qty - 1); upd(); }; $('#p', s).onclick = () => { qty++; upd(); };
    $('#add', s).onclick = () => {
      const o = opts();
      const miss = groups.find((g, gi) => g.required && !s.querySelector(`[name=g${gi}]:checked`));
      if (miss) return toast(`${L('Choisissez', 'Choose')} : ${miss.group}`);
      const note = $('#note', s).value.trim();
      const same = cart.find((c) => c.product_id === it.id && c.options.join() === o.join() && c.note === note);
      if (same) same.qty += qty; else cart.push({ product_id: it.id, name: nm(it), qty, options: o, note, unit: unit() });
      close(); render(); toast(`${qty} × ${nm(it)} ${L('ajouté', 'added')}`);
    };
    upd();
  });
}
const cartTotal = () => cart.reduce((t, c) => t + c.qty * c.unit, 0);
const cartCount = () => cart.reduce((t, c) => t + c.qty, 0);
function cartLines() {
  return `<div class="lines">${cart.map((c, i) => `<div class="l"><span><b>${c.qty} × ${esc(c.name)}</b>${c.options.length ? `<small>${esc(c.options.join(', '))}</small>` : ''}${c.note ? `<small>“${esc(c.note)}”</small>` : ''}</span><span class="row"><b>${money(c.qty * c.unit)}</b><button class="btn sm" data-rm="${i}">−</button></span></div>`).join('')}</div>`;
}

// ---------------- Check (table and tracking) ----------------

const anyMomo = () => Object.values(info.momo || {}).some(Boolean);
function paySheet(c) {
  const tips = info.tips?.length ? info.tips : [5, 10, 15];

  sheet(`<h2>${L('Payer l\'addition', 'Pay the bill')}</h2><p class="muted" style="margin:0">${L('Payez en toute sécurité depuis votre téléphone. Vous confirmez avec votre code secret Mobile Money.', 'Pay securely from your phone. You confirm with your Mobile Money PIN.')}</p>

    <div class="opt"><h4>${L('Pourboire pour l\'équipe', 'Tip for the team')} ${c.server ? `· ${esc(c.server)}` : ''}</h4><div class="tips ch">${[0, ...tips].map((p) => `<label><input type="radio" name="tp" value="${p}" ${p === 0 ? 'checked' : ''}><span style="width:100%;text-align:center">${p ? `${p} %` : L('Non', 'No')}</span></label>`).join('')}</div></div>
    <div class="opt"><h4>${L('Moyen de paiement', 'Payment method')}</h4><div class="ch">${Object.entries({ mtn_momo: 'MTN MoMo', orange_money: 'Orange Money' }).filter(([k]) => info.momo[k]).map(([k, l]) => `<label><input type="radio" name="pv" value="${k}" ${k === provider ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
    <label class="f">${L('Votre numéro Mobile Money', 'Your Mobile Money number')}<input class="in" id="ph" type="tel" inputmode="tel" placeholder="6XX XX XX XX"></label>
    <label class="f">${L('Votre prénom (facultatif)', 'Your first name (optional)')}<input class="in" id="py"></label>
    <div class="tot big" style="margin-top:14px"><span>${L('Vous payez', 'You pay')}</span><span id="pt"></span></div>
    <button class="btn primary block" id="go" style="margin-top:10px">${L('Payer maintenant', 'Pay now')}</button><div id="msg"></div>`, (s, close) => {
    const upd = () => { const n = Number(s.querySelector('[name=sh]:checked').value); share = n === 1 ? c.due : Math.ceil(c.due / n / 25) * 25; tipPct = Number(s.querySelector('[name=tp]:checked').value); provider = s.querySelector('[name=pv]:checked')?.value || provider; $('#pt', s).textContent = money(share + tip()); };
    const tip = () => Math.round(share * tipPct / 100 / 50) * 50;
    s.addEventListener('change', upd); upd();
    $('#go', s).onclick = async (e) => {
      const ph = $('#ph', s).value.replace(/\D/g, '');
      if (ph.length < 9) return toast(L('Saisissez votre numéro', 'Enter your number'));
      e.target.disabled = true;
      try {
        const r = await api(`/api/public/resto/check/${c.token}/pay`, { provider, phone: ph, amount: Math.min(share, c.due), tip: tip(), payer: $('#py', s).value });
        $('#msg', s).innerHTML = `<div class="ok" style="background:var(--ind-l);color:var(--navy);margin-top:12px">📱 ${L('Validez le paiement sur votre téléphone avec votre code secret…', 'Approve the payment on your phone with your PIN…')}${r.mode === 'simulation' ? `<div class="sm muted">${L('(démonstration : confirmé automatiquement en 5 s)', '(demo: auto-confirmed in 5 s)')}</div>` : ''}</div>`;
        const t0 = Date.now();
        const poll = async () => {
          const st = await api(`/api/public/resto/check/${c.token}/pay/${r.id}`).catch(() => ({ status: 'pending' }));
          if (st.status === 'successful') { check = st.check; close(); render(); toast(L('Paiement reçu, merci !', 'Payment received, thank you!')); if (check.status === 'paid' && !check.reviewed) setTimeout(() => reviewSheet(check), 700); return; }
          if (st.status === 'failed') { $('#msg', s).innerHTML = `<div class="err">${L('Paiement non abouti', 'Payment failed')} ${esc(st.reason || '')}</div>`; e.target.disabled = false; return; }
          if (Date.now() - t0 < 300e3) setTimeout(poll, 2500);
        };
        setTimeout(poll, 2500);
      } catch (err) { $('#msg', s).innerHTML = `<div class="err">${esc(err.message)}</div>`; e.target.disabled = false; }
    };
  });
}

    bindLang(); return;
  }
  if (!info.online_reservations) { app.innerHTML = `${hero(L('Réservation', 'Booking'), L('Appelez-nous pour réserver.', 'Call us to book.'))}<div class="wrap"><div class="card">${info.phone ? `<a class="btn primary block" href="tel:${esc(info.phone)}">📞 ${esc(info.phone)}</a>` : ''}</div></div>`; bindLang(); return; }
  const days = Array.from({ length: 14 }, (_, i) => new Date(Date.now() + 3600e3 + i * 864e5).toISOString().slice(0, 10));
  app.innerHTML = `${hero(L('Réserver une table', 'Book a table'), `${esc(info.cuisine || '')}${info.address ? ` · ${esc(info.address)}` : ''}`)}
  <div class="wrap"><div class="card"><h2>${L('Quand ?', 'When?')}</h2>
    <div class="cats" style="position:static;padding-top:0">${days.map((d) => { const x = new Date(d + 'T12:00:00Z'); return `<button data-d="${d}" class="${d === resDate ? 'on' : ''}" style="display:flex;flex-direction:column;align-items:center;line-height:1.2;border-radius:14px"><small>${x.toLocaleDateString(lang === 'en' ? 'en-GB' : 'fr-FR', { weekday: 'short', timeZone: 'UTC' })}</small><b style="font-size:18px">${x.getUTCDate()}</b></button>`; }).join('')}</div>
    <h2 style="margin-top:12px">${L('Combien ?', 'How many?')}</h2><div class="cats" style="position:static;padding-top:0">${[1, 2, 3, 4, 5, 6, 8, 10, 12].map((n) => `<button data-n="${n}" class="${n === resCovers ? 'on' : ''}">${n}</button>`).join('')}</div>
    <h2 style="margin-top:12px">${L('À quelle heure ?', 'What time?')}</h2>${slots === null ? '<div class="skel" style="height:90px"></div>' : slots.length ? `<div class="slots">${slots.map((s) => `<button data-t="${s.time}" ${s.free ? '' : 'disabled'} class="${s.time === resTime ? 'on' : ''}">${s.time}</button>`).join('')}</div>` : `<p class="muted">${L('Plus de créneau ce jour-là.', 'No more slots that day.')}</p>`}</div>
    ${resTime ? `<div class="card"><h2>${L('Vos coordonnées', 'Your details')}</h2><label class="f">${L('Nom', 'Name')}<input class="in" id="n" autocomplete="name"></label><label class="f">${L('Téléphone (WhatsApp)', 'Phone (WhatsApp)')}<input class="in" id="p" type="tel" autocomplete="tel"></label><label class="f">E-mail<input class="in" id="e" type="email" autocomplete="email"></label>
      <label class="f">${L('Une occasion particulière ?', 'A special occasion?')}<select class="in" id="o"><option value="">—</option>${[L('Anniversaire', 'Birthday'), L('Repas d\'affaires', 'Business dinner'), L('Rendez-vous galant', 'Date night'), L('Demande en mariage', 'Proposal'), L('Famille', 'Family')].map((x) => `<option>${esc(x)}</option>`).join('')}</select></label>
      <label class="f">${L('Allergies, préférences…', 'Allergies, preferences…')}<input class="in" id="nt"></label><button class="btn primary block" id="go" style="margin-top:14px">${L('Confirmer pour', 'Confirm for')} ${resCovers} · ${esc(resTime)}</button></div>` : ''}
    <div class="foot">${esc(info.name)}<br>${L('Propulsé par', 'Powered by')} Teknons Resto</div></div>`;
  bindLang();
  document.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { resDate = b.dataset.d; resTime = ''; loadSlots(); });
  document.querySelectorAll('[data-n]').forEach((b) => b.onclick = () => { resCovers = Number(b.dataset.n); resTime = ''; loadSlots(); });
  document.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { resTime = b.dataset.t; render(); $('#n')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  $('#go')?.addEventListener('click', async (e) => {
    e.target.disabled = true;
    try { booked = await api('/api/public/resto/reserve', { c: cParam || info.id, date: resDate, time: resTime, covers: resCovers, name: $('#n').value, phone: $('#p').value, email: $('#e').value, occasion: $('#o').value, note: $('#nt').value }); render(); window.scrollTo(0, 0); }
    catch (err) { toast(err.message); e.target.disabled = false; }
  });
}

function schedulePoll(fn) { clearTimeout(pollT); pollT = setTimeout(() => fn().catch(() => {}), 8000); }
function render() {
  document.documentElement.lang = lang;
  if (info?.name) document.title = `${info.name}${mode === 'table' ? ` · ${L('Table', 'Table')} ${info.table.label}` : mode === 'reserve' ? ` · ${L('Réservation', 'Booking')}` : ''}`;
  ({ table: renderTable, track: renderTrack, order: renderOrder, reserve: renderReserve })[mode]();
}
(async () => {
  try {
    if (mode === 'table') { const r = await api(`/api/public/resto/table/${encodeURIComponent(token)}`); check = r.check; info = r; }
    else if (mode === 'track') { const r = await api(`/api/public/resto/check/${encodeURIComponent(token)}`); check = r.check; info = r; }
    else { info = await api(`/api/public/resto${cParam ? `?c=${encodeURIComponent(cParam)}` : ''}`); }
    render();
    if (mode === 'reserve') loadSlots();
  } catch (e) { app.innerHTML = `${hero(L('Oups', 'Oops'), esc(e.message))}<div class="wrap"><div class="card"><p>${esc(e.message)}</p></div></div>`; bindLang(); }
})();
</script>
</body>
</html>
